{% extends "base.html" %}
{% block title %}Panel — Mirror Laboral{% endblock %}
{% block content %}
<h1>Panel de casos derivados</h1>
<p style="opacity:0.75;">Acceso solo para el equipo de profesionales que colabora con Mirror Laboral.</p>

{% if error %}
<div class="card" style="border-color:#d98a5f;">
  <p style="margin:0;color:#7a3a1e;">{{ error }}</p>
</div>
{% endif %}

<form method="post" action="/panel/login" class="card">
  <fieldset>
    <legend>¿Quién eres?</legend>
    <div class="opciones">
      <label><input type="radio" name="profesional" value="paz" required> Paz (psicóloga)</label>
      <label><input type="radio" name="profesional" value="abogada" required> Abogada</label>
    </div>
  </fieldset>
  <fieldset>
    <label class="campo-label">Contraseña</label>
    <input type="password" name="password" required>
  </fieldset>
  <button type="submit">Ingresar</button>
</form>
{% endblock %}
